<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Flash Meet · Rạp phim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--card:#161616;--card2:#1d1d1d;--line:#2a2a2a;--ink:#f2f2f2;--mut:#9a9a9a;
  --mint:#19c5b1;--mint-d:#12a695;--sub:1;    /* --sub = subtitle brightness 0…1 */
  --fs:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  letter-spacing:-.01em;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
.hide{display:none!important}

/* ── 1. setup ───────────────────────────────────────────────── */
.setup{min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.back{width:40px;height:40px;margin-left:-8px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.back svg{width:24px;height:24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:6px 0 6px}
.lead{margin:0 0 20px;color:var(--mut);font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px}
.lab{display:block;font-size:12.5px;color:var(--mut);margin:0 0 7px}
.row+.row{margin-top:16px}
.sel{position:relative}
.sel select{width:100%;height:50px;padding:0 40px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  font-size:15px;appearance:none;-webkit-appearance:none}
.sel.on select{border-color:var(--mint)}
.sel svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut);pointer-events:none}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);
  font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--mint);border-color:var(--mint);color:#04211e;font-weight:600}
.slide{display:flex;align-items:center;gap:12px}
.slide .a1{font-size:13px;color:var(--mut)}
.slide .a2{font-size:21px;color:var(--mut)}
.slide .pc{min-width:42px;text-align:right;font-size:13px;color:var(--mut)}
.slide svg{width:18px;height:18px;color:var(--mut);flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:#3a3a3a;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px;
  box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;cursor:pointer}
.sw{display:flex;align-items:center;gap:14px;cursor:pointer}
.sw .tx{flex:1;min-width:0}
.sw b{display:block;font-size:15px;font-weight:600}
.sw small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.tog{flex:none;width:52px;height:31px;border-radius:99px;background:#3a3a3a;position:relative;transition:.16s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.16s}
.sw.on .tog{background:var(--mint)}
.sw.on .tog::after{left:24px}
.note{display:flex;gap:10px;margin:16px 0 0;padding-top:15px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.5}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.go{margin-top:auto;height:58px;border:0;border-radius:16px;background:var(--mint);color:#04211e;font-size:17px;font-weight:700;cursor:pointer}
.go:active{background:var(--mint-d)}
.setup .go{margin-top:22px}
.err{margin:12px 0 0;color:#ff8d8d;font-size:13px;line-height:1.5;text-align:center}

/* ── 2. watching ────────────────────────────────────────────── */
.watch{position:fixed;inset:0;display:none;flex-direction:column;background:#000}
body.watching .watch{display:flex}
body.watching .setup{display:none}
.wTop{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;
  transition:opacity .35s;z-index:2}
.wPill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.06);
  border:0;font-size:13px;color:#cfcfcf;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(25,197,177,.6);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(25,197,177,0)}100%{box-shadow:0 0 0 0 rgba(25,197,177,0)}}
.wPill svg{width:13px;height:13px;opacity:.7}
.stage{flex:1;display:grid;place-items:center;padding:60px 22px;min-height:0}
.subs{width:100%;max-width:760px;text-align:center}
.main{font-size:var(--fs);line-height:1.38;font-weight:500;color:rgba(255,255,255,var(--sub));margin:0;word-break:break-word}
.main .i{color:rgba(255,255,255,calc(var(--sub)*.55))}
.werr{margin:16px 0 0;font-size:13px;line-height:1.5;color:#ff8d8d;opacity:.85;min-height:1px}
.wHint{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;
  color:rgba(255,255,255,.35);transition:opacity .35s;z-index:2}
body.dimui .wTop,body.dimui .wHint{opacity:0;pointer-events:none}

/* ── 3. controls sheet ──────────────────────────────────────── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:#121212;border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
body.sheeton .sheet{transform:none}
.grab{width:46px;height:4px;border-radius:99px;background:#3d3d3d;margin:2px auto 12px}
.sHead{display:flex;align-items:center;margin-bottom:14px}
.sHead b{font-size:18px;font-weight:600}
.sHead button{margin-left:auto;width:34px;height:34px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.sHead svg{width:20px;height:20px}
.sRow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #202020}
.sRow:last-of-type{border-bottom:0}
.sRow>span.k{font-size:14.5px;color:#d6d6d6;flex:none}
.sRow .sel{margin-left:auto;width:190px}
.sRow .sel select{height:44px;font-size:14px}
.sizeBtns{margin-left:auto;display:flex;gap:8px}
.sizeBtns button{width:56px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-size:15px;
  font-weight:600;cursor:pointer}
.sheet .slide{flex:1}
.sheet .sw{padding:12px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.acts button{height:52px;border-radius:14px;font-size:15.5px;font-weight:600;cursor:pointer}
.bGhost{border:1px solid var(--line);background:var(--card2);color:var(--ink)}
.bMint{border:0;background:var(--mint);color:#04211e}
@media(min-width:720px){
  .setup{max-width:520px;margin:0 auto}
  .sheet{max-width:560px;margin:0 auto;border-radius:22px 22px 0 0}
  .main{font-size:calc(var(--fs)*1.25)}
}
</style>
</head>
<body>

<!-- 1 ─ setup -->
<main class="setup" id="setup">
  <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 data-t="h1">Rạp phim</h1>
  <p class="lead" data-t="lead">Đọc bản dịch trong lúc xem phim</p>

  <section class="card">
    <div class="row">
      <label class="lab" for="src" data-t="srcLab">Ngôn ngữ phim</label>
      <div class="sel"><select id="src"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>

    <div class="row">
      <label class="lab" for="tgt" data-t="tgtLab">Dịch sang</label>
      <div class="sel on"><select id="tgt"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="row">
      <span class="lab" data-t="sizeLab">Cỡ chữ</span>
      <div class="slide"><span class="a1">A</span><input type="range" id="size" min="20" max="54" step="2" value="30"><span class="a2">A</span></div>
    </div>

    <div class="row">
      <span class="lab" data-t="briLab">Độ sáng</span>
      <div class="slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.2v2.4M12 19.4v2.4M4.2 12H1.8M22.2 12h-2.4M6.3 6.3 4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7"/></svg>
        <input type="range" id="bri" min="8" max="100" step="1" value="15"><span class="pc" id="briPc">15%</span>
      </div>
    </div>

    <div class="row">
      <div class="sw on" id="dimSw" role="switch" aria-checked="true" tabindex="0">
        <span class="tx"><b data-t="dimT">Ẩn nút khi đang xem</b><small data-t="dimD">Giúp tập trung hơn khi xem phim.</small></span>
        <span class="tog"></span>
      </div>
    </div>

    <p class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2.6" width="6" height="11" rx="3"/><path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0M12 17.9v3.5"/></svg>
      <span><span data-t="micT">Cho phép micro để nhận âm thanh phim.</span><br><span data-t="micD">Chỉ xử lý âm thanh, không lưu trữ.</span></span>
    </p>
  </section>

  <p class="err hide" id="err"></p>
  <button class="go" id="start" data-t="start">Bắt đầu xem</button>
</main>

<!-- 2 ─ watching -->
<section class="watch" id="watch" aria-live="polite">
  <div class="wTop">
    <button class="wPill" id="pill" type="button">
      <i class="dot" id="dot"></i><span id="pillTx">Đang nghe · Tiếng Việt</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="stage">
    <div class="subs">
      <p class="main" id="main" data-t="waiting">Phụ đề sẽ hiện ở đây khi phim bắt đầu nói.</p>
      <p class="werr" id="werr"></p>
    </div>
  </div>
  <div class="wHint" id="hint" data-t="tapHint">Chạm để mở điều khiển</div>
</section>

<!-- 3 ─ controls -->
<aside class="sheet" id="sheet" aria-label="Controls">
  <div class="grab"></div>
  <div class="sHead"><b data-t="ctl">Điều khiển</b>
    <button id="sheetX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="sRow"><span class="k" data-t="tgtLab">Dịch sang</span>
    <div class="sel"><select id="tgt2"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  </div>

  <div class="sRow"><span class="k" data-t="briLab">Độ sáng</span>
    <div class="slide"><input type="range" id="bri2" min="8" max="100" step="1" value="15"><span class="pc" id="briPc2">15%</span></div>
  </div>

  <div class="sRow"><span class="k" data-t="sizeLab">Cỡ chữ</span>
    <div class="sizeBtns"><button id="fsDown" aria-label="A-">A−</button><button id="fsUp" aria-label="A+">A+</button></div>
  </div>

  <div class="acts">
    <button class="bGhost" id="pause" data-t="pause">Tạm dừng</button>
    <button class="bMint" id="stop" data-t="stop">Kết thúc</button>
  </div>
</aside>

<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const SIGNED=Q.get('signed')==='1';
const PLAN=Q.get('plan')||'free';
const UNLIMITED=SIGNED&&(PLAN==='business'||PLAN==='enterprise');
const ANON_LIMIT=180;                       // guests: the same 3 free minutes as the meeting app

/* ── languages ─────────────────────────────────────────────── */
const LANGS=[['vi','Tiếng Việt'],['en','English'],['ko','한국어'],['ja','日本語'],['zh','中文'],['th','ไทย'],['es','Español'],['fr','Français'],['de','Deutsch'],['ru','Русский']];
const HINTS=['en','vi','ko','ja','zh','es','fr'];

/* ── copy ──────────────────────────────────────────────────── */
const I18N={
 vi:{h1:'Rạp phim',lead:'Đọc bản dịch trong lúc xem phim',srcLab:'Ngôn ngữ phim',auto:'Tự động nhận diện',tgtLab:'Dịch sang',
  sizeLab:'Cỡ chữ',briLab:'Độ sáng',dimT:'Ẩn nút khi đang xem',dimD:'Giúp tập trung hơn khi xem phim.',
  micT:'Cho phép micro để nhận âm thanh phim.',micD:'Chỉ xử lý âm thanh, không lưu trữ.',start:'Bắt đầu xem',
  listening:'Đang nghe',paused:'Tạm dừng',waiting:'Phụ đề sẽ hiện ở đây khi phim bắt đầu nói.',tapHint:'Chạm để mở điều khiển',
  ctl:'Điều khiển',pause:'Tạm dừng',resume:'Tiếp tục',stop:'Kết thúc',
  micErr:'Không mở được micro. Hãy cho phép quyền micro rồi thử lại.',netErr:'Mất kết nối — đang thử lại…',
  anonOut:'Bạn đã dùng hết 3 phút dùng thử. Đăng nhập để tiếp tục.',quotaOut:'Đã hết phút trong gói. Nâng cấp để tiếp tục.',signIn:'Đăng nhập'},
 en:{h1:'Cinema mode',lead:'Read the translation while you watch',srcLab:'Film language',auto:'Detect automatically',tgtLab:'Translate into',
  sizeLab:'Text size',briLab:'Brightness',dimT:'Hide the buttons while watching',dimD:'Fewer distractions during the film.',
  micT:'Allow the microphone to hear the film.',micD:'Audio is processed only, never stored.',start:'Start watching',
  listening:'Listening',paused:'Paused',waiting:'Captions appear here once the film starts speaking.',tapHint:'Tap to open the controls',
  ctl:'Controls',pause:'Pause',resume:'Resume',stop:'Finish',
  micErr:'Could not open the microphone. Allow microphone access and try again.',netErr:'Connection lost — retrying…',
  anonOut:'Your 3 free minutes are used up. Sign in to continue.',quotaOut:'No minutes left on your plan. Upgrade to continue.',signIn:'Sign in'},
 ko:{h1:'영화관 모드',lead:'영화를 보면서 번역을 읽으세요',srcLab:'영화 언어',auto:'자동 감지',tgtLab:'번역 언어',
  sizeLab:'글자 크기',briLab:'밝기',dimT:'볼 때 버튼 숨기기',dimD:'영화에 더 집중할 수 있습니다.',
  micT:'영화 소리를 듣기 위해 마이크를 허용하세요.',micD:'소리는 처리만 하며 저장하지 않습니다.',start:'보기 시작',
  listening:'듣는 중',paused:'일시 중지',waiting:'영화에서 말이 시작되면 자막이 여기에 표시됩니다.',tapHint:'탭하면 설정이 열립니다',
  ctl:'설정',pause:'일시 중지',resume:'계속',stop:'종료',
  micErr:'마이크를 열 수 없습니다. 권한을 허용하고 다시 시도하세요.',netErr:'연결이 끊겼습니다 — 다시 시도 중…',
  anonOut:'무료 3분을 모두 사용했습니다. 로그인하면 계속할 수 있습니다.',quotaOut:'요금제의 남은 시간이 없습니다. 업그레이드하세요.',signIn:'로그인'}
};
let UI=(localStorage.getItem('mr_lang')||'vi');
if(!I18N[UI])UI='vi';
const t=k=>(I18N[UI][k]!=null?I18N[UI][k]:(I18N.en[k]||k));
document.documentElement.lang=UI;

/* ── saved preferences ─────────────────────────────────────── */
const st=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let src=st('fm_cin_src','auto'), tgt=st('fm_cin_tgt',UI==='ko'?'ko':UI==='en'?'en':'vi');
let fs=parseInt(st('fm_cin_fs','30'),10), bri=parseInt(st('fm_cin_bri','15'),10);
let dimUi=st('fm_cin_dim','1')==='1';

function fillSelects(){
  const opts=l=>l.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
  $('src').innerHTML=`<option value="auto">${t('auto')}</option>`+opts(LANGS);
  $('tgt').innerHTML=opts(LANGS); $('tgt2').innerHTML=opts(LANGS);
  $('src').value=src; $('tgt').value=tgt; $('tgt2').value=tgt;
  const quick=[['vi','Tiếng Việt'],['en','English'],['ko','한국어']];
  $('chips').innerHTML=quick.map(([c,n])=>`<button type="button" class="chip${c===tgt?' on':''}" data-c="${c}">${n}</button>`).join('');
}
function applyText(){
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(I18N[UI][k]!=null)el.textContent=I18N[UI][k]});
  document.title='Flash Meet · '+t('h1');
}
function langName(c){const f=LANGS.find(x=>x[0]===c);return f?f[1]:c}
function applyPrefs(){
  document.documentElement.style.setProperty('--fs',fs+'px');
  document.documentElement.style.setProperty('--sub',(bri/100).toFixed(2));
  $('size').value=fs; $('bri').value=bri; $('bri2').value=bri;
  $('briPc').textContent=bri+'%'; $('briPc2').textContent=bri+'%';
  $('dimSw').classList.toggle('on',dimUi); $('dimSw').setAttribute('aria-checked',String(dimUi));
  $('pillTx').textContent=(paused?t('paused'):t('listening'))+' · '+langName(tgt);
}

/* ── usage: the same meters as the meeting app ─────────────── */
const anonUsed=()=>parseInt(localStorage.getItem('mr_anon_used')||'0',10)||0;
const anonAdd=s=>localStorage.setItem('mr_anon_used',anonUsed()+s);
let usage={unlimited:UNLIMITED,remainDay:null,remainMonth:null};
async function fetchUsage(){if(!SIGNED)return;try{const r=await fetch('/api/usage');const d=await r.json();
  if(r.ok)usage={unlimited:!!d.unlimited,remainDay:d.day&&d.day.remain!=null?d.day.remain:null,remainMonth:d.month&&d.month.remain!=null?d.month.remain:null};}catch(e){}}
function quotaOk(){if(usage.unlimited)return true;
  if(usage.remainMonth!=null&&usage.remainMonth<=0)return false;
  if(usage.remainDay!=null&&usage.remainDay<=0)return false;return true;}
let meter=null,pending=0;
async function report(sec){if(!SIGNED||usage.unlimited||sec<=0)return;
  try{const r=await fetch('/api/usage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seconds:sec})});
    const d=await r.json();if(r.ok)usage={unlimited:!!d.unlimited,remainDay:d.day&&d.day.remain!=null?d.day.remain:null,remainMonth:d.month&&d.month.remain!=null?d.month.remain:null};}catch(e){}}
function meterStart(){if(usage.unlimited||meter)return;
  meter=setInterval(async()=>{pending++;
    if(!SIGNED){anonAdd(1);if(anonUsed()>=ANON_LIMIT){meterStop();stopAll();gate('anonOut')}return}
    if(pending>=20){const s=pending;pending=0;await report(s);if(!quotaOk()){meterStop();stopAll();gate('quotaOut')}}},1000);}
function meterStop(){if(meter){clearInterval(meter);meter=null}if(pending>0){const s=pending;pending=0;report(s)}}
function gateOk(){
  if(!SIGNED)return anonUsed()<ANON_LIMIT||(gate('anonOut'),false);
  return quotaOk()||(gate('quotaOut'),false);}
function gate(key){
  showErr(t(key)+' ');
  const a=document.createElement('a');a.href=SIGNED?'/pricing':'/login';a.target='_top';
  a.textContent=SIGNED?'→':' '+t('signIn')+' →';a.style.cssText='color:#19c5b1;font-weight:600;text-decoration:none';
  $('err').appendChild(a);}
function showErr(m){$('err').textContent=m;$('err').classList.remove('hide');$('werr').textContent=m}
function clearErr(){$('err').textContent='';$('err').classList.add('hide');$('werr').textContent=''}

/* ── Soniox realtime: mic → translated captions ────────────── */
let stream=null,ws=null,rec=null,gen=0,stopping=false,paused=false,wake=null;
let segTrans='';
function pickMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  if(window.MediaRecorder&&MediaRecorder.isTypeSupported)for(const m of c)if(MediaRecorder.isTypeSupported(m))return m;return''}

async function openSocket(){
  const my=++gen;
  let tok;
  try{
    const r=await fetch('/api/soniox-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'token');tok=d.apiKey||d.api_key||d.key;
  }catch(e){showErr(t('netErr'));setTimeout(()=>{if(!stopping&&my===gen)openSocket()},2500);return}
  if(stopping||my!==gen||!stream)return;
  const s=new WebSocket('wss://stt-rt.soniox.com/transcribe-websocket');ws=s;
  s.onopen=()=>{
    clearErr();
    const cfg={api_key:tok,model:'stt-rt-v4',audio_format:'auto',
      language_hints:src==='auto'?HINTS:[src],
      enable_endpoint_detection:true,
      translation:{type:'one_way',target_language:tgt}};
    s.send(JSON.stringify(cfg));
    const mime=pickMime();
    try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){showErr(t('micErr'));return}}
    rec.ondataavailable=async e=>{if(e.data.size&&s.readyState===1)s.send(await e.data.arrayBuffer())};
    rec.start(240);
    meterStart();
  };
  s.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.error_code){showErr(m.error_message||m.error_code);return}
    let tI='';
    (m.tokens||[]).forEach(tk=>{const x=tk.text;if(x==null)return;
      if(x==='<end>'){flush();return}
      if(tk.translation_status==='translation'){tk.is_final?segTrans+=x:tI+=x}});
    render(tI);
    if(m.finished)flush();};
  s.onerror=()=>{if(!stopping)showErr(t('netErr'))};
  s.onclose=()=>{
    if(ws===s)ws=null;
    if(my!==gen)return;
    if(rec&&rec.state!=='inactive'){try{rec.stop()}catch(e){}}rec=null;
    if(!stopping&&!paused)setTimeout(()=>{if(!stopping&&!paused&&my===gen)openSocket()},700);};
}
// Only the last translated sentence is on screen — a cinema subtitle, not a transcript,
// and never the film's own language.
function render(tI){
  if(!segTrans&&!tI)return;
  $('main').innerHTML=esc(segTrans.trim())+(tI?(segTrans?' ':'')+'<span class="i">'+esc(tI.trim())+'</span>':'');
}
function flush(){
  const tr=segTrans.trim();
  if(tr)$('main').textContent=tr;
  segTrans='';
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function startWatch(){
  clearErr();
  await fetchUsage();
  if(!gateOk())return;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}
  catch(e){showErr(t('micErr'));return}
  stopping=false;paused=false;
  document.body.classList.add('watching');
  $('main').textContent=t('waiting');
  applyPrefs();
  openSocket();
  keepAwake();
  if(dimUi)dimSoon();
}
function stopAudio(){
  stopping=true;gen++;
  if(rec&&rec.state!=='inactive'){try{rec.stop()}catch(e){}}rec=null;
  if(ws){try{ws.close()}catch(e){}ws=null}
  meterStop();
}
function stopAll(){
  stopAudio();
  if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  document.body.classList.remove('watching','sheeton','dimui');
  releaseWake();
  segTrans='';
}
function setPaused(p){
  paused=p;
  if(p){stopAudio();$('dot').style.animation='none';$('dot').style.background='#777'}
  else{stopping=false;$('dot').style.removeProperty('animation');$('dot').style.removeProperty('background');openSocket()}
  $('pause').textContent=p?t('resume'):t('pause');
  applyPrefs();
}
// Screen stays on while the film plays (where the browser supports it).
async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake){wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('watching')&&!wake)keepAwake()});

/* ── chrome that fades away ────────────────────────────────── */
let dimT=0;
function dimSoon(){clearTimeout(dimT);document.body.classList.remove('dimui');
  if(dimUi&&document.body.classList.contains('watching')&&!document.body.classList.contains('sheeton'))
    dimT=setTimeout(()=>document.body.classList.add('dimui'),2600)}
function sheet(open){document.body.classList.toggle('sheeton',open);if(open){clearTimeout(dimT);document.body.classList.remove('dimui')}else dimSoon()}

/* ── wiring ────────────────────────────────────────────────── */
fillSelects();applyText();applyPrefs();
$('back').onclick=()=>{try{if(window.top!==window)window.top.location.href='/';else history.length>1?history.back():location.href='/'}catch(e){location.href='/'}};
$('src').onchange=e=>{src=e.target.value;save('fm_cin_src',src)};
function setTgt(v){tgt=v;save('fm_cin_tgt',v);$('tgt').value=v;$('tgt2').value=v;
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===v));
  applyPrefs();
  if(document.body.classList.contains('watching')&&!paused){stopAudio();stopping=false;segTrans='';openSocket()}}
$('tgt').onchange=e=>setTgt(e.target.value);
$('tgt2').onchange=e=>setTgt(e.target.value);
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b)setTgt(b.dataset.c)};
$('size').oninput=e=>{fs=+e.target.value;save('fm_cin_fs',fs);applyPrefs()};
const onBri=v=>{bri=+v;save('fm_cin_bri',bri);applyPrefs()};
$('bri').oninput=e=>onBri(e.target.value);
$('bri2').oninput=e=>onBri(e.target.value);
$('fsDown').onclick=()=>{fs=Math.max(20,fs-2);save('fm_cin_fs',fs);applyPrefs()};
$('fsUp').onclick=()=>{fs=Math.min(54,fs+2);save('fm_cin_fs',fs);applyPrefs()};
const toggle=(el,get,set)=>{const go=()=>{set(!get());applyPrefs()};el.onclick=go;
  el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();go()}}};
toggle($('dimSw'),()=>dimUi,v=>{dimUi=v;save('fm_cin_dim',v?'1':'0');if(!v)document.body.classList.remove('dimui');else dimSoon()});
$('start').onclick=startWatch;
$('pause').onclick=()=>setPaused(!paused);
$('stop').onclick=()=>{stopAll();clearErr()};
$('sheetX').onclick=()=>sheet(false);
$('pill').onclick=e=>{e.stopPropagation();sheet(true)};
$('watch').addEventListener('click',()=>{document.body.classList.contains('sheeton')?sheet(false):sheet(true)});
$('sheet').addEventListener('click',e=>e.stopPropagation());
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('sheeton'))sheet(false)});
addEventListener('pagehide',()=>{stopAll()});
fetchUsage();
</script>
</body>
