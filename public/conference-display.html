<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flash Meet Conference Mode</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#101827;--mut:#718096;--line:#dfe7f1;--blue:#176bff;--shadow:0 24px 68px rgba(39,72,115,.11)}body.dark{--bg:#07111b;--card:#0d1924;--ink:#f7f9fb;--mut:#9eafbd;--line:#20313f;--blue:#4592ff;--shadow:0 28px 76px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 50% -20%,rgba(23,107,255,.12),transparent 40%),var(--bg);color:var(--ink);overflow:hidden}.app{height:100%;display:grid;grid-template-rows:68px 1fr}.top{display:flex;align-items:center;gap:14px;padding:0 26px;background:color-mix(in srgb,var(--card) 88%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;gap:9px;align-items:center;font-size:19px;font-weight:700}.brand img{width:31px}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--blue);font-weight:700}.grow{flex:1}.status{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#a6b0bb}.status.live .dot{background:#ef4444;box-shadow:0 0 0 5px rgba(239,68,68,.1)}.status.live b{color:#ef4444}.btn{height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 13px;font-size:11px;font-weight:650;cursor:pointer}.main{min-height:0;padding:18px 28px 24px;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px}.head{display:flex;align-items:end;gap:18px}.head small{font-size:9px;letter-spacing:.24em;color:var(--mut);font-weight:700}.head h1{font-size:30px;letter-spacing:-.04em;margin:5px 0 0;line-height:1.1}.headActions{margin-left:auto;display:flex;gap:8px;align-items:center}.seg{display:flex;padding:3px;border:1px solid var(--line);background:var(--card);border-radius:10px}.seg button{border:0;background:transparent;color:var(--mut);font-size:10px;font-weight:700;padding:7px 10px;border-radius:7px;cursor:pointer}.seg button.on{background:var(--blue);color:#fff}.start{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer}.start.stop{background:#111827}.config{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:auto}.config label{font-size:9px;color:var(--mut)}select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:650}.hint{font-size:9px;color:var(--mut);margin-left:5px}.panels{min-height:0;display:grid;gap:16px}.panels.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panels.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1280px;width:100%;margin:auto}.panel{--accent:#176bff;min-width:0;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:23px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:68px 1fr}.ph{display:flex;align-items:center;gap:11px;padding:0 19px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}.flag{font-size:25px}.lname{font-size:17px;font-weight:700;letter-spacing:-.02em}.lsub{font-size:8px;color:var(--mut);letter-spacing:.12em;font-weight:700}.plive{margin-left:auto;color:var(--accent);font-size:9px;font-weight:800}.pb{min-height:0;padding:23px 25px;display:flex;flex-direction:column;overflow:hidden}.speaker{font-size:9px;color:var(--accent);font-weight:700;letter-spacing:.05em}.current{font-size:clamp(29px,2.5vw,47px);font-weight:650;line-height:1.4;letter-spacing:-.025em;margin-top:11px;overflow-wrap:anywhere}.current.empty{color:var(--mut);font-size:clamp(21px,1.7vw,30px);font-weight:500}.listen{display:none;color:var(--accent);font-size:9px;font-weight:650;margin-top:14px}.running .listen{display:block}.hist{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:6px}.hist div{font-size:12px;line-height:1.45;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{display:flex;align-items:center;color:var(--mut);font-size:9px}.wm{margin-left:auto;display:flex;align-items:center;gap:8px;opacity:.9}.wm img{width:27px}.wm b{display:block;color:var(--ink);font-size:13px}.wm span{font-size:7px;letter-spacing:.16em}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);opacity:0;background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:10px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}body.full .top{display:none}body.full .app{grid-template-rows:1fr}body.full .main{padding:22px 28px}body.full .current{font-size:clamp(38px,3vw,58px)}@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100%;grid-template-rows:62px auto}.top{padding:0 14px}.badge{display:none}.main{grid-template-rows:auto auto auto auto;padding:14px}.head{align-items:flex-start;flex-direction:column}.headActions{margin:0}.panels.two,.panels.three{grid-template-columns:1fr}.panel{min-height:380px}.wm{margin-left:0}.footer{gap:10px;flex-wrap:wrap}}
</style></head><body><div class="app"><header class="top"><div class="brand"><img src="/logo.svg">Flash Meet</div><div class="badge">▣ Mode hội nghị · màn hình lớn</div><div class="grow"></div><div id="status" class="status"><i class="dot"></i><b>Sẵn sàng</b><span id="clock">00:00:00</span></div><button id="theme" class="btn">◐</button><button id="full" class="btn">⛶ Toàn màn hình</button></header><main class="main"><section class="head"><div><small>HỘI NGHỊ · SỰ KIỆN · PHỤ ĐỀ ĐA NGỮ</small><h1>Phụ đề trực tiếp cho cả khán phòng.</h1></div><div class="headActions"><div class="seg"><button data-n="2">2 ngôn ngữ</button><button class="on" data-n="3">3 ngôn ngữ</button></div><button id="start" class="start">Bắt đầu hội nghị</button></div></section><section class="config"><label>Khung 1</label><select id="l1"></select><label>Khung 2</label><select id="l2"></select><label id="l3lab">Khung 3</label><select id="l3"></select><span class="hint">Tự nhận diện ngôn ngữ người nói · mỗi khung là một ngôn ngữ riêng</span></section><section id="panels" class="panels three"></section><footer class="footer"><span>Live Translation Display · route thử nghiệm ẩn, chưa có trong menu</span><div class="wm"><img src="/logo.svg"><div><b>Flash Meet</b><span>BREAK LANGUAGE BARRIERS</span></div></div></footer></main></div><div id="toast" class="toast"></div><script>
const L=[{c:'ko',n:'한국어',s:'KOREAN',f:'🇰🇷',to:'Korean',a:'#2d6cdf'},{c:'vi',n:'Tiếng Việt',s:'VIETNAMESE',f:'🇻🇳',to:'Vietnamese',a:'#0ca678'},{c:'en',n:'English',s:'ENGLISH',f:'🇺🇸',to:'English',a:'#7455db'},{c:'ja',n:'日本語',s:'JAPANESE',f:'🇯🇵',to:'Japanese',a:'#d95555'},{c:'zh',n:'中文',s:'CHINESE',f:'🇨🇳',to:'Chinese',a:'#d9822b'}],$=x=>document.getElementById(x);let count=3,running=false,stream=null,ws=null,rec=null,clockI=null,startAt=0,retry=0,seg={t:'',lang:null,spk:null},ctx=[];const H={1:[],2:[],3:[]};
function opts(el,d){el.innerHTML=L.map(x=>`<option value="${x.c}" ${x.c===d?'selected':''}>${x.f} ${x.n}</option>`).join('')}opts($('l1'),'ko');opts($('l2'),'vi');opts($('l3'),'en');
function langs(){return [1,2,3].slice(0,count).map(i=>L.find(x=>x.c===$('l'+i).value))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const ls=langs();$('panels').className='panels '+(count===3?'three':'two');$('l3').style.display=$('l3lab').style.display=count===3?'':'none';$('panels').innerHTML=ls.map((x,i)=>`<article class="panel ${running?'running':''}" style="--accent:${x.a}"><div class="ph"><span class="flag">${x.f}</span><div><div class="lname">${x.n}</div><div class="lsub">${x.s}</div></div><div class="plive">● ${running?'LIVE':'READY'}</div></div><div class="pb"><div id="sp${i+1}" class="speaker">${running?'Đang chờ người nói…':'Sẵn sàng hiển thị'}</div><div id="cu${i+1}" class="current empty">Phụ đề sẽ xuất hiện ở đây.</div><div class="listen">▮▮▮ Đang nhận giọng nói</div><div id="hi${i+1}" class="hist"></div></div></article>`).join('')}render();
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function time(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function startClock(){startAt=Date.now();clearInterval(clockI);clockI=setInterval(()=>$('clock').textContent=time(Math.floor((Date.now()-startAt)/1000)),1000)}function mime(){for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return''}
async function getTok(){const r=await fetch('/api/soniox-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transcribeOnly:true})}),d=await r.json();if(!r.ok)throw Error(d.error||'Không lấy được token');return d.api_key}
async function begin(){if(running)return end();try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch{toast('Hãy cho phép microphone để bắt đầu.');return}running=true;retry=0;ctx=[];seg={t:'',lang:null,spk:null};$('status').classList.add('live');$('status').querySelector('b').textContent='ĐANG DỊCH TRỰC TIẾP';$('start').textContent='Kết thúc';$('start').classList.add('stop');startClock();render();openWs()}
async function openWs(){if(!running)return;let key;try{key=await getTok()}catch(e){toast(e.message);return end()}const w=new WebSocket('wss://stt-rt.soniox.com/transcribe-websocket');ws=w;w.onopen=()=>{retry=0;w.send(JSON.stringify({api_key:key,model:'stt-rt-v4',audio_format:'auto',language_hints:['ko','vi','en','ja','zh'],enable_speaker_diarization:true,enable_endpoint_detection:true}));const mt=mime();rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);rec.ondataavailable=async e=>{if(e.data.size&&w.readyState===1)w.send(await e.data.arrayBuffer())};rec.start(240)};w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.error_code){toast(m.error_message||m.error_code);return}let inter='';for(const t of (m.tokens||[])){if(t.text==null)continue;if(t.text==='<end>'){commit();continue}if(t.is_final){seg.t+=t.text;if(t.language)seg.lang=t.language;if(t.speaker!=null)seg.spk=t.speaker}else inter+=t.text}showInter((seg.t+inter).trim(),seg.lang,seg.spk);if(m.finished)commit()};w.onclose=()=>{ws=null;if(rec&&rec.state!=='inactive'){try{rec.stop()}catch{}}rec=null;if(running){retry++;retry<5?setTimeout(openWs,800):(toast('Mất kết nối dịch.'),end())}}}
function showInter(t,src,spk){if(!t)return;langs().forEach((x,i)=>{if(src&&x.c===src){$('cu'+(i+1)).textContent=t;$('cu'+(i+1)).classList.remove('empty');$('sp'+(i+1)).textContent=spk!=null?'Speaker '+spk:'Đang nói…'}})}
async function commit(){const t=seg.t.trim(),src=seg.lang,spk=seg.spk;seg={t:'',lang:null,spk:null};if(!t)return;const recent=ctx.slice(-2).join('\n'),ls=langs(),vals=await Promise.all(ls.map(async x=>{if(src===x.c)return t;try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src:t,to:x.to,context:recent})}),d=await r.json();return r.ok?d.translation:t}catch{return t}}));ctx.push(t);if(ctx.length>6)ctx.shift();vals.forEach((v,i)=>{const n=i+1,cur=$('cu'+n);if(cur.textContent&&cur.textContent!=='Phụ đề sẽ xuất hiện ở đây.')H[n].unshift(cur.textContent);H[n]=H[n].slice(0,2);cur.textContent=v;cur.classList.remove('empty');$('sp'+n).textContent=spk!=null?'Speaker '+spk:'Người nói';$('hi'+n).innerHTML=H[n].map(x=>`<div>${esc(x)}</div>`).join('')})}
function end(){running=false;clearInterval(clockI);clockI=null;$('clock').textContent='00:00:00';$('status').classList.remove('live');$('status').querySelector('b').textContent='Sẵn sàng';$('start').textContent='Bắt đầu hội nghị';$('start').classList.remove('stop');if(rec&&rec.state!=='inactive'){try{rec.stop()}catch{}}rec=null;if(ws){try{ws.close()}catch{}}ws=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}render()}
$('start').onclick=begin;document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{count=+b.dataset.n;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render()});['l1','l2','l3'].forEach(x=>$(x).onchange=render);$('theme').onclick=()=>document.body.classList.toggle('dark');$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('full',!!document.fullscreenElement);$('full').textContent=document.fullscreenElement?'⤡ Thoát toàn màn hình':'⛶ Toàn màn hình'});window.addEventListener('beforeunload',end);
</script></body></html>
