<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flash Meet — Conference History</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#111827;--mut:#718096;--line:#dfe7f1;--blue:#176bff;--soft:#eef4fb;--shadow:0 20px 55px rgba(39,72,115,.09)}*{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink)}.top{height:66px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 22px;gap:10px;position:sticky;top:0}.top img{width:30px}.top b{font-size:18px}.wrap{width:min(1000px,calc(100% - 30px));margin:36px auto}.ey{font-size:9px;letter-spacing:.2em;color:var(--mut);font-weight:700}.h1{font-size:34px;letter-spacing:-.04em;margin:6px 0 22px}.grid{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}.meta{flex:1;min-width:0}.title{font-weight:700;font-size:14px}.sub{font-size:10px;color:var(--mut);margin-top:5px}.langs{display:flex;gap:5px;margin-top:8px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:9px;font-weight:650}.status{font-size:9px;font-weight:700;padding:6px 9px;border-radius:999px;background:#edf2f7;color:var(--mut)}.status.live{background:#fee2e2;color:#dc2626}.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 12px;font-size:10px;font-weight:700;text-decoration:none}.empty{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--mut);font-size:12px}.back{margin-left:auto;color:var(--blue);font-size:11px;text-decoration:none}@media(max-width:650px){.wrap{margin-top:24px}.h1{font-size:28px}.card{align-items:flex-start;flex-wrap:wrap}.meta{width:100%}.btn{margin-left:auto}}</style></head><body><header class="top"><img src="/logo.svg"><b>Flash Meet</b><span style="color:#718096;font-size:11px">Conference History</span><a class="back" href="/conference-mode">← Mode hội nghị</a></header><main class="wrap"><div class="ey">SCRIPT · SUMMARY · REVIEW</div><h1 class="h1">Các hội nghị đã lưu</h1><div id="list" class="grid"><div class="empty">Đang tải lịch sử…</div></div></main><script>const $=x=>document.getElementById(x),names={ko:'한국어',vi:'Tiếng Việt',en:'English',ja:'日本語',zh:'中文'};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch('/api/conference?action=list'),d=await r.json();if(r.status===401){$('list').innerHTML='<div class="empty">Vui lòng <a href="/login">đăng nhập</a> để xem lịch sử hội nghị.</div>';return}if(!r.ok)throw Error(d.error||'load failed');const a=d.sessions||[];$('list').innerHTML=a.length?a.map(x=>`<article class="card"><div class="meta"><div class="title">${esc(x.title||x.id)}</div><div class="sub">${esc(x.id)} · ${new Date(x.createdAt).toLocaleString()}${x.durationSec?' · '+Math.round(x.durationSec/60)+' phút':''}</div><div class="langs">${(x.languages||[]).map(c=>`<span class="tag">${esc(names[c]||c)}</span>`).join('')}</div></div><span class="status ${x.status==='live'?'live':''}">${x.status==='ended'?'Đã kết thúc':x.status==='live'?'Đang live':'Sẵn sàng'}</span><a class="btn" href="/conference-view?id=${encodeURIComponent(x.id)}&review=1">Xem lại</a></article>`).join(''):'<div class="empty">Chưa có hội nghị nào được lưu.</div>'}catch(e){$('list').innerHTML='<div class="empty">Không tải được lịch sử hội nghị.</div>'}}load()</script></body></html>
