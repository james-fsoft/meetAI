<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Flash Meet — Stage Window</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#fff;--mut:rgba(255,255,255,.72);--glass:rgba(4,12,20,.58);--line:rgba(255,255,255,.14);--accent:#62a6ff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;overflow:hidden;background:#07111d;color:var(--ink)}.stage{position:relative;height:100%;isolation:isolate;background:#07111d}.stage:before{content:"";position:absolute;inset:0;z-index:-3;background:var(--stage-bg,linear-gradient(135deg,#0b1d3c,#0c4aa8 58%,#112449));background-size:cover;background-position:center}.stage:after{content:"";position:absolute;inset:0;z-index:-2;background:rgba(4,10,18,var(--overlay,.18))}.stage.clean{--ink:#0c1728;--mut:#66758a;--glass:rgba(255,255,255,.72);--line:rgba(13,36,69,.10);--accent:#176bff;--stage-bg:radial-gradient(circle at 12% 0,rgba(84,159,255,.18),transparent 35%),linear-gradient(180deg,#f9fbfe,#eef5ff)}.stage.dark{--stage-bg:radial-gradient(circle at 50% -20%,rgba(54,123,255,.22),transparent 40%),linear-gradient(145deg,#050b12,#0c1723 55%,#0b2034)}.stage.blue{--stage-bg:linear-gradient(120deg,#0a2a66,#0d64c7 48%,#16407d)}.stage.black{--stage-bg:#03070b}.stage.custom:before{background-image:var(--custom-bg)}.top{height:72px;padding:0 28px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent)}.flag{font-size:30px}.lname{font-size:20px;font-weight:700;letter-spacing:-.02em}.meta{font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:700}.grow{flex:1}.live{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}.live i{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 5px rgba(239,68,68,.12)}.live.off i{background:#94a3b8;box-shadow:none}.body{height:calc(100% - 72px);display:flex;flex-direction:column;justify-content:center;padding:5vh 5vw 6vh}.speaker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}.caption{font-size:clamp(44px,5vw,88px);font-weight:650;line-height:1.32;letter-spacing:-.035em;text-wrap:balance;max-width:92%;text-shadow:0 3px 22px rgba(0,0,0,.18)}.clean .caption{text-shadow:none}.caption.draft{opacity:.72}.previous{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font-size:clamp(17px,1.45vw,26px);line-height:1.55;color:var(--mut);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wm{position:absolute;right:24px;bottom:20px;display:flex;align-items:center;gap:9px;opacity:.86}.wm img{width:30px;height:30px}.wm b{display:block;font-size:14px}.wm small{display:block;font-size:7px;letter-spacing:.18em;color:var(--mut)}.cid{position:absolute;left:24px;bottom:22px;font-size:9px;color:var(--mut);letter-spacing:.08em}.state{position:absolute;inset:0;display:none;place-items:center;background:rgba(4,10,18,.62);backdrop-filter:blur(10px);z-index:20}.state.on{display:grid}.card{background:rgba(10,20,31,.88);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 24px;color:#fff;text-align:center;max-width:460px}.card h2{margin:0 0 8px;font-size:20px}.card p{margin:0;color:#aebdca;font-size:12px;line-height:1.6}.hoverbar{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transition:.18s;z-index:10}.stage:hover .hoverbar{opacity:1}.hoverbar button{border:1px solid var(--line);background:var(--glass);color:var(--ink);backdrop-filter:blur(12px);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:700;cursor:pointer}@media(max-width:700px){.top{padding:0 16px}.body{padding:4vh 18px 6vh}.caption{font-size:clamp(38px,10vw,64px);max-width:100%}.previous{max-width:100%}.wm{right:14px;bottom:12px}.cid{left:14px;bottom:14px}.hoverbar{opacity:1}}</style></head><body><main id="stage" class="stage blue"><div class="hoverbar"><button id="full">⛶ Fullscreen</button><button id="reload">↻</button></div><header class="top"><span id="flag" class="flag">🌐</span><div><div id="lname" class="lname">Language</div><div id="lsub" class="meta">LIVE TRANSLATION</div></div><div class="grow"></div><div id="live" class="live off"><i></i><span id="status">CONNECTING</span></div></header><section class="body"><div id="speaker" class="speaker">Flash Meet Conference</div><div id="caption" class="caption">Đang kết nối với hội nghị…</div><div id="previous" class="previous"></div></section><div id="cid" class="cid"></div><div class="wm"><img src="/logo.svg" alt=""><div><b>Flash Meet</b><small>LIVE TRANSLATION</small></div></div></main><div id="state" class="state"><div class="card"><h2 id="stateTitle">Đang kết nối…</h2><p id="stateText">Cửa sổ sẽ tự nhận phụ đề theo Conference ID.</p></div></div><script>
const LANG={ko:{name:'한국어',sub:'KOREAN',flag:'🇰🇷'},vi:{name:'Tiếng Việt',sub:'VIETNAMESE',flag:'🇻🇳'},en:{name:'English',sub:'ENGLISH',flag:'🇺🇸'},ja:{name:'日本語',sub:'JAPANESE',flag:'🇯🇵'},zh:{name:'中文',sub:'CHINESE',flag:'🇨🇳'}};const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),id=(q.get('id')||'').toUpperCase(),lang=q.get('lang')||'vi';let conf=null,sb=null,ch=null,lastText='',lastFinal='',poll=null;const info=LANG[lang]||LANG.vi;$('flag').textContent=info.flag;$('lname').textContent=info.name;$('lsub').textContent=info.sub;$('cid').textContent=id||'NO CONFERENCE ID';document.title=`Flash Meet · ${info.name} · ${id||'Stage'}`;
function bgKey(){return 'fm_stage_bg_'+id}function applyBg(){let cfg={preset:q.get('bg')||'blue',overlay:.18};try{cfg={...cfg,...JSON.parse(localStorage.getItem(bgKey())||'{}')}}catch{};const s=$('stage');s.className='stage '+(cfg.customDataUrl?'custom':(cfg.preset||'blue'));s.style.setProperty('--overlay',String(cfg.overlay??.18));if(cfg.customDataUrl)s.style.setProperty('--custom-bg',`url(${JSON.stringify(cfg.customDataUrl)})`)}applyBg();window.addEventListener('storage',e=>{if(e.key===bgKey())applyBg()});
function setStatus(t,live){$('status').textContent=t;$('live').classList.toggle('off',!live)}function fitText(t){const n=(t||'').length;const el=$('caption');el.style.fontSize=n>220?'clamp(32px,3.6vw,60px)':n>120?'clamp(38px,4.3vw,70px)':'clamp(44px,5vw,88px)'}function show(text,speaker,draft){if(!text)return;if(!draft&&lastText&&lastText!==text){lastFinal=lastText;$('previous').textContent=lastFinal}lastText=text;$('caption').textContent=text;$('caption').classList.toggle('draft',!!draft);$('speaker').textContent=speaker!=null?`Speaker ${speaker}`:'Đang nói';fitText(text)}function valueFromItem(item){if(!item)return'';if(item.sourceLang===lang)return item.original||'';return item.translations?.[lang]||item.original||''}
function onCaption(p){if(!p)return;if(p.draft){const v=p.values?.[lang]||(p.sourceLang===lang?p.original:'');if(v)show(v,p.speaker,true);setStatus('LIVE',true)}else if(p.item){const v=valueFromItem(p.item);if(v)show(v,p.item.speaker,false);setStatus('LIVE',true)}}function onState(s){if(!s)return;conf=s;setStatus(s.status==='live'?'LIVE':String(s.status||'READY').toUpperCase(),s.status==='live');const item=s.latest||(s.transcript||[]).slice(-1)[0];if(item){const v=valueFromItem(item);if(v)show(v,item.speaker,false)}}
async function load(){if(!id){$('state').classList.add('on');$('stateTitle').textContent='Thiếu Conference ID';$('stateText').textContent='Mở cửa sổ này từ Conference Mode để nhận ID tự động.';return}try{const r=await fetch('/api/conference?id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw Error(d.error||'Không tìm thấy hội nghị');$('state').classList.remove('on');onState(d.conference)}catch(e){$('state').classList.add('on');$('stateTitle').textContent='Chưa tìm thấy hội nghị';$('stateText').textContent=e.message||'Kiểm tra Conference ID.'}}
async function realtime(){try{const c=await fetch('/api/ext-config').then(r=>r.json());if(!c.supabaseUrl||!c.anonKey||!window.supabase)return;sb=window.supabase.createClient(c.supabaseUrl,c.anonKey,{auth:{persistSession:false,autoRefreshToken:false}});ch=sb.channel('conference:'+id).on('broadcast',{event:'caption'},x=>onCaption(x.payload)).on('broadcast',{event:'state'},x=>onState(x.payload)).on('broadcast',{event:'ended'},x=>{setStatus('ENDED',false);onState(x.payload?.conference)}).subscribe(st=>{if(st==='SUBSCRIBED')ch.send({type:'broadcast',event:'request_state',payload:{from:'stage',lang}})})}catch{}}
$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};$('reload').onclick=()=>location.reload();load();realtime();poll=setInterval(load,2500);window.addEventListener('beforeunload',()=>{clearInterval(poll);try{ch?.unsubscribe()}catch{}});
</script></body></html>
