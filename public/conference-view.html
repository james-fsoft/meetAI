<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Flash Meet — Conference Viewer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#111827;--mut:#718096;--line:#dfe7f1;--blue:#176bff;--soft:#eef4fb;--shadow:0 24px 68px rgba(39,72,115,.11)}body.dark{--bg:#07111b;--card:#0d1924;--ink:#f7f9fb;--mut:#9eafbd;--line:#20313f;--blue:#4592ff;--soft:#112231;--shadow:0 28px 76px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 50% -20%,rgba(23,107,255,.11),transparent 42%),var(--bg);color:var(--ink)}button,input{font:inherit}.app{min-height:100%;display:grid;grid-template-rows:64px auto}.top{display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}.brand{display:flex;gap:8px;align-items:center;font-weight:700}.brand img{width:29px}.grow{flex:1}.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:10px;font-weight:650}.pill{background:var(--soft)}.wrap{width:min(1220px,calc(100% - 30px));margin:auto;padding:18px 0 26px}.hero{display:flex;align-items:end;gap:12px;margin-bottom:14px}.hero small{font-size:8px;letter-spacing:.2em;color:var(--mut);font-weight:700}.hero h1{font-size:28px;margin:4px 0 0;letter-spacing:-.04em}.status{margin-left:auto;color:var(--mut);font-size:10px}.live{color:#ef4444}.tabs{display:flex;gap:5px;margin:10px 0 14px}.tabs button{border:0;background:var(--soft);color:var(--mut);border-radius:9px;padding:8px 11px;font-size:9px;font-weight:700}.tabs button.on{background:var(--blue);color:#fff}.panels{display:grid;gap:14px}.panels.one{grid-template-columns:1fr}.panels.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panels.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{--accent:#176bff;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:21px;box-shadow:var(--shadow);overflow:hidden;min-height:330px;display:grid;grid-template-rows:62px 1fr}.ph{display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}.flag{font-size:23px}.lname{font-size:15px;font-weight:700}.lsub{font-size:8px;color:var(--mut);letter-spacing:.12em}.plive{margin-left:auto;color:var(--accent);font-size:9px;font-weight:800}.pb{padding:20px;display:flex;flex-direction:column}.speaker{font-size:8px;color:var(--accent);font-weight:700}.current{font-size:clamp(26px,2.4vw,44px);font-weight:650;line-height:1.42;letter-spacing:-.02em;margin-top:9px}.current.empty{color:var(--mut);font-size:20px;font-weight:500}.draft{opacity:.62}.hist{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:5px}.hist div{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.review{display:none}.review.on{display:block}.segrow{padding:14px 0;border-bottom:1px solid var(--line)}.segmeta{font-size:9px;color:var(--mut);margin-bottom:5px}.segorig{font-size:13px;line-height:1.55}.segtrans{font-size:12px;color:var(--mut);margin-top:4px}.md{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;font-size:13px;line-height:1.7}.insgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.insbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.insbox b{font-size:10px}.insbox ul{padding-left:18px;font-size:12px;line-height:1.6}.join{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}.join.hide{display:none}.joincard{width:min(440px,calc(100vw - 30px));background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.joincard h2{margin:0 0 6px}.joincard p{font-size:11px;line-height:1.55;color:var(--mut)}.joinrow{display:flex;gap:7px}.joinrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:11px;font-size:12px;text-transform:uppercase}.joinrow button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 14px;font-size:10px;font-weight:700}.vbar{display:none;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.vf{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mut)}.vf select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700}.vchk input{width:17px;height:17px;accent-color:var(--blue)}.srcLine{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}.srcLab{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--mut)}.srcTx{font-size:15px;line-height:1.5;color:var(--mut);margin-top:4px}.saveCard{display:none;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:16px;box-shadow:var(--shadow)}.saveCard.on{display:flex}.saveCard b{font-size:15px}.saveCard p{margin:4px 0 0;color:var(--mut);font-size:12.5px;line-height:1.5}.saveAct{display:flex;gap:9px;flex-wrap:wrap}.btnPri{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:11px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.btnGhost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 16px;font-size:13px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}.wm{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px;color:var(--mut);font-size:9px}.wm img{width:25px}.wm b{color:var(--ink)}@media(max-width:800px){.top{padding:0 12px}.wrap{width:min(100% - 20px,700px)}.hero{align-items:flex-start;flex-direction:column}.status{margin:0}.panels.two,.panels.three{grid-template-columns:1fr}.panel{min-height:300px}.insgrid{grid-template-columns:1fr}.pill.hideMob{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><img src="/logo.svg">Flash Meet</div><div id="idpill" class="pill">Conference</div><div class="grow"></div><button id="theme" class="btn">◐</button><button id="copy" class="btn hideMob">Copy link</button></header><main class="wrap"><section class="hero"><div><small>LIVE CONFERENCE VIEWER</small><h1 id="title">Đang kết nối hội nghị…</h1></div><div id="status" class="status">Đang tải…</div></section><div class="tabs"><button class="on" data-tab="live">Live</button><button data-tab="transcript">Transcript</button><button data-tab="summary">Tóm tắt</button><button data-tab="insights">Việc cần làm</button></div><div class="vbar" id="vbar" hidden><label class="vf">Ngôn ngữ<select id="vLang"></select></label><label class="vf vchk"><input type="checkbox" id="vSrc"><span>Hiện thêm ngôn ngữ gốc</span></label></div><section id="liveView"><div id="panels" class="panels three"></div></section><section id="saveCard" class="saveCard" hidden><div><b>Lưu hội nghị này</b><p id="saveMsg">Bản ghi và tóm tắt sẽ được lưu vào Lịch họp của bạn.</p></div><div class="saveAct"><button id="saveBtn" class="btnPri">Lưu vào tài khoản</button><a id="saveLink" class="btnGhost" href="/dashboard" target="_top" hidden>Mở Lịch họp</a></div></section><section id="reviewView" class="review"></section><div class="wm"><img src="/logo.svg"><div><b>Flash Meet</b> · Live Translation</div></div></main></div><div id="join" class="join"><div class="joincard"><h2>Nhập Conference ID</h2><p>Nhập ID do host chia sẻ để xem phụ đề live, transcript và tóm tắt trên thiết bị này.</p><div class="joinrow"><input id="joinid" placeholder="FM-XXXX-XXXX-XX"><button id="joinbtn">Tham gia</button></div></div></div><script>
const L={ko:{n:'한국어',s:'KOREAN',f:'🇰🇷',a:'#2d6cdf'},vi:{n:'Tiếng Việt',s:'VIETNAMESE',f:'🇻🇳',a:'#0ca678'},en:{n:'English',s:'ENGLISH',f:'🇺🇸',a:'#7455db'},ja:{n:'日本語',s:'JAPANESE',f:'🇯🇵',a:'#d95555'},zh:{n:'中文',s:'CHINESE',f:'🇨🇳',a:'#d9822b'}},$=x=>document.getElementById(x);let id='',conf=null,sb=null,channel=null,poll=null,activeTab='live',draftValues={};const H={1:[],2:[],3:[]};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function params(){return new URLSearchParams(location.search)}function normalize(v){return String(v||'').trim().toUpperCase()}
const NL=String.fromCharCode(10);
function stored(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function isPhone(){return window.matchMedia('(max-width:700px)').matches}
let vSrc=stored('fm_view_src','0')==='1';
function confLangs(){return (conf&&conf.languages||['ko','vi','en']).slice(0,(conf&&conf.panelCount)||3)}
// Default: the language the reader is most likely to want - their own, otherwise one that is
// being translated INTO (not the language currently being spoken).
function viewLang(){const all=confLangs(),saved=stored('fm_view_lang','');
  if(all.includes(saved))return saved;
  const nav=(navigator.language||'').slice(0,2).toLowerCase();
  if(all.includes(nav))return nav;
  const src=(conf&&conf.latest&&conf.latest.sourceLang)||'';
  return all.find(c=>c!==src)||all[0]}
function syncVBar(){const bar=$('vbar');if(!bar||!conf)return;const all=confLangs(),phone=isPhone();
  bar.hidden=!(phone&&all.length>1);bar.style.display=bar.hidden?'none':'flex';
  const sel=$('vLang');if(!sel)return;const cur=viewLang();
  const want=all.join(',');if(sel.dataset.langs!==want){sel.dataset.langs=want;
    sel.innerHTML=all.map(c=>`<option value="${c}">${(L[c]||{n:c}).f||''} ${(L[c]||{n:c}).n}</option>`).join('')}
  sel.value=cur;$('vSrc').checked=vSrc}
// A snapshot from the server can be a sentence behind what is already on screen - never step backwards.
function itemTs(x){return x&&x.ts?new Date(x.ts).getTime():0}
function mergeConf(next){if(!next)return;
  if(!conf){conf=next;return}
  const keep=itemTs(conf.latest)>itemTs(next.latest)||(conf.transcript||[]).length>(next.transcript||[]).length;
  const merged={...conf,...next};
  if(keep){merged.latest=conf.latest;merged.transcript=conf.transcript}
  conf=merged}
function syncSave(){const c=$('saveCard');if(!c||!conf)return;const ended=conf.status==='ended'&&(conf.transcript||[]).length>0;
  c.hidden=!ended;c.classList.toggle('on',ended)}
function buildMeeting(){const tr=conf.transcript||[],target=viewLang();
  const live=tr.map(x=>({src:x.original||'',tgt:(x.translations&&x.translations[target])||'',spk:typeof x.speaker==='number'?x.speaker:null}));
  const text=tr.map(x=>(x.speaker!=null?'Speaker '+x.speaker+': ':'')+(x.original||'')).join(NL);
  const started=conf.startedAt?new Date(conf.startedAt).getTime():Date.now();
  return {client_id:started,title:'Hội nghị '+(conf.id||''),summary:conf.summaryMarkdown||'',transcript:text,live,started_at:started,duration_sec:Number(conf.durationSec)||0}}
async function saveToAccount(){const b=$('saveBtn'),m=$('saveMsg');if(!conf)return;
  const old=b.textContent;b.disabled=true;b.textContent='Đang lưu…';
  try{const r=await fetch('/api/meetings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meeting:buildMeeting()})});
    if(r.status===401||r.status===403){m.innerHTML='Bạn cần đăng nhập để lưu hội nghị này. <a href="/login" target="_top">Đăng nhập</a> rồi bấm Lưu lại.';b.textContent=old;b.disabled=false;return}
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error==='meetings_table_missing'?'Lịch họp chưa sẵn sàng':(d.error||'Lưu không thành công'));
    m.textContent='Đã lưu vào Lịch họp của bạn.';$('saveLink').hidden=false;b.textContent='Đã lưu';b.disabled=true}
  catch(e){m.textContent='Chưa lưu được: '+e.message;b.textContent=old;b.disabled=false}}
async function loadConference(cid,quiet=false){cid=normalize(cid);if(!cid)return;try{const r=await fetch('/api/conference?id='+encodeURIComponent(cid)),d=await r.json();if(!r.ok)throw Error(d.error||'Không tìm thấy hội nghị');id=cid;if(quiet&&conf)mergeConf(d.conference);else conf=d.conference;$('join').classList.add('hide');history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(id));renderState();if(!channel)await connectRealtime();startPoll();return true}catch(e){if(!quiet)alert(e.message);return false}}
function renderState(){if(!conf)return;$('idpill').textContent=conf.id;$('title').textContent=conf.title||'Flash Meet Conference';$('status').textContent=conf.status==='live'?'● ĐANG DỊCH TRỰC TIẾP':conf.status==='ended'?'Đã kết thúc':'Sẵn sàng';$('status').classList.toggle('live',conf.status==='live');syncVBar();renderPanels();syncSave();if(activeTab!=='live')renderReview(activeTab)}function renderPanels(){const all=confLangs(),phone=isPhone(),langs=phone?[viewLang()]:all;
  $('panels').className='panels '+(phone?'one':langs.length===2?'two':'three');const latest=conf.latest||null;
  const srcTx=(latest&&latest.original)||'',srcC=(latest&&latest.sourceLang)||'';$('panels').innerHTML=langs.map((c,i)=>{const l=L[c]||{n:c,s:c.toUpperCase(),f:'🌐',a:'#176bff'},val=draftValues[c]||latest?.translations?.[c]||(latest?.sourceLang===c?latest?.original:'')||'';return `<article class="panel" style="--accent:${l.a}"><div class="ph"><span class="flag">${l.f}</span><div><div class="lname">${l.n}</div><div class="lsub">${l.s}</div></div><div class="plive">● ${conf.status==='live'?'LIVE':'READY'}</div></div><div class="pb"><div class="speaker">${latest?.speaker!=null?'Speaker '+esc(latest.speaker):'Flash Meet'}</div><div class="current ${val?'':'empty'} ${draftValues[c]?'draft':''}">${esc(val||'Phụ đề sẽ xuất hiện ở đây.')}</div>${(phone&&vSrc&&srcTx&&srcC!==c)?`<div class="srcLine"><div class="srcLab">NGÔN NGỮ GỐC${srcC?' · '+esc((L[srcC]||{n:srcC}).n):''}</div><div class="srcTx">${esc(srcTx)}</div></div>`:''}<div class="hist">${historyFor(c).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div></article>`}).join('')}function historyFor(c){return (conf.transcript||[]).slice(-3,-1).reverse().map(x=>x.translations?.[c]||(x.sourceLang===c?x.original:'')).filter(Boolean)}
async function connectRealtime(){try{const c=await fetch('/api/ext-config').then(r=>r.json());if(!c.supabaseUrl||!c.anonKey||!window.supabase)return;sb=window.supabase.createClient(c.supabaseUrl,c.anonKey,{auth:{persistSession:false,autoRefreshToken:false}});channel=sb.channel('conference:'+id).on('broadcast',{event:'caption'},({payload})=>{if(payload?.draft){draftValues=payload.values||{};if(conf){conf.latest={...(conf.latest||{}),speaker:payload.speaker,sourceLang:payload.sourceLang,original:payload.original,translations:payload.values||{}}}renderPanels()}else if(payload?.item){draftValues={};conf.transcript=[...(conf.transcript||[]),payload.item].slice(-6000);conf.latest=payload.item;renderState()}}).on('broadcast',{event:'state'},({payload})=>{if(payload){mergeConf(payload);renderState()}}).on('broadcast',{event:'ended'},({payload})=>{if(payload?.conference){mergeConf(payload.conference);renderState()}}).subscribe(async st=>{if(st==='SUBSCRIBED')try{await channel.send({type:'broadcast',event:'request_state',payload:{viewer:true}})}catch{}})}catch(e){console.warn(e)}}function startPoll(){clearInterval(poll);poll=setInterval(()=>loadConference(id,true),3500)}
function renderReview(tab){activeTab=tab;$('liveView').style.display=tab==='live'?'':'none';$('reviewView').classList.toggle('on',tab!=='live');[...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='live')return;const b=$('reviewView');if(tab==='transcript'){b.innerHTML=(conf.transcript||[]).length?(conf.transcript||[]).map(x=>`<div class="segrow"><div class="segmeta">${new Date(x.ts).toLocaleTimeString()} · ${x.speaker!=null?'Speaker '+esc(x.speaker):'Speaker'} · ${esc(x.sourceLang||'auto')}</div><div class="segorig">${esc(x.original)}</div>${Object.entries(x.translations||{}).filter(([k,v])=>v&&v!==x.original).map(([k,v])=>`<div class="segtrans">${esc(k.toUpperCase())} → ${esc(v)}</div>`).join('')}</div>`).join(''):'<div class="md">Chưa có transcript.</div>'}else if(tab==='summary'){b.innerHTML=`<div class="md">${esc(conf.summaryMarkdown||'Tóm tắt sẽ xuất hiện sau khi host kết thúc hội nghị.')}</div>`}else{const z=conf.insights||{};b.innerHTML=`<div class="insgrid"><div class="insbox"><b>TÓM TẮT NHANH</b><ul>${(z.summary||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div><div class="insbox"><b>VIỆC CẦN LÀM</b><ul>${(z.actionItems||[]).map(x=>`<li>${esc((x.who?x.who+' — ':'')+(x.task||''))}</li>`).join('')||'<li>—</li>'}</ul></div><div class="insbox"><b>QUYẾT ĐỊNH</b><ul>${(z.decisions||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div><div class="insbox"><b>RỦI RO / THEO DÕI</b><ul>${(z.risks||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div></div>`}}
[...document.querySelectorAll('.tabs button')].forEach(b=>b.onclick=()=>renderReview(b.dataset.tab));$('joinbtn').onclick=()=>loadConference($('joinid').value);$('joinid').onkeydown=e=>{if(e.key==='Enter')loadConference($('joinid').value)};$('vLang').onchange=e=>{store('fm_view_lang',e.target.value);renderPanels()};
$('vSrc').onchange=e=>{vSrc=e.target.checked;store('fm_view_src',vSrc?'1':'0');renderPanels()};
$('saveBtn').onclick=saveToAccount;
addEventListener('resize',()=>{if(conf){syncVBar();renderPanels()}});
$('theme').onclick=()=>document.body.classList.toggle('dark');$('copy').onclick=()=>navigator.clipboard.writeText(location.href);id=normalize(params().get('id'));if(id){$('joinid').value=id;loadConference(id)}
</script></body></html>
