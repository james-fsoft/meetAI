let UI=(()=>{let v=null;try{v=localStorage.getItem('mr_lang')}catch(e){}if(v==='vi'||v==='en'||v==='ko')return v;const n=(navigator.language||'').toLowerCase();return n.startsWith('ko')?'ko':n.startsWith('vi')?'vi':'en'})();

function t(k,a){const d=I18N[UI]||I18N.en;const s=d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k);return a!=null?s.replace('{n}',a):s}
function sumLang(){return SUM_LANG[UI]||'English'}
function subName(x){const n=t('ln_'+x.c);return UI==='ko'?n:n.toUpperCase()}
function setStatus(k){statusKey=k;$('status').querySelector('b').textContent=t('st_'+k)}
function setSave(k,x){saveKey=k;saveExtra=x||'';$('saveState').textContent=t('sv_'+k)+(saveExtra?' '+saveExtra:'')}
function updateIdPill(){$('idpill').textContent=conference?conference.id:needLogin?t('needLoginPill'):idError?t('noIdPill'):t('creatingId');$('note').hidden=!needLogin||!!conference}
function syncStart(){const b=$('start');b.textContent=t(running?'end':'start');b.dataset.tip=t(running?'tipEnd':'tipStart');b.classList.toggle('idle',!running&&!transcript.length)}

function applyLang(first){document.documentElement.lang=UI;document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});document.querySelectorAll('[data-i18n-tip]').forEach(e=>{e.dataset.tip=t(e.dataset.i18nTip)});['uilang','guideLang'].forEach(id=>{$(id).value=UI});syncStart();setStatus(statusKey);setSave(saveKey,saveExtra);updateIdPill();
  if(first||!running)render();else langs().forEach((x,i)=>{const p=$('p'+(i+1));if(!p)return;p.querySelector('.lsub').textContent=subName(x);p.querySelector('.draghint').textContent='⋮⋮ '+t('drag');p.querySelector('.listen').textContent='▮▮▮ '+t('listening')});
  if($('drawer').classList.contains('on'))showTab(curTab)}

function opts(el,d){el.innerHTML=L.map(x=>`<option value="${x.c}" ${x.c===d?'selected':''}>${x.f} ${x.n}</option>`).join('')}opts($('l1'),'ko');opts($('l2'),'vi');opts($('l3'),'en');function langs(){return [1,2,3].slice(0,count).map(i=>L.find(x=>x.c===$('l'+i).value))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function fmt(sec){return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}function duration(){return startAt?Math.max(0,Math.floor((Date.now()-startAt)/1000)):Number(conference?.durationSec||0)}

function mkTyper(el){const T={el,f:'',full:'',shown:'',raf:0,last:0};T.render=()=>{const s=T.shown,k=Math.min(T.f.length,s.length);T.el.innerHTML=esc(s.slice(0,k))+(s.length>k?'<span class="int">'+esc(s.slice(k))+'</span>':'')};T.step=now=>{const dt=Math.min(80,now-T.last);T.last=now;const rem=T.full.length-T.shown.length;if(rem>0){const add=Math.max(1,Math.round(Math.max(30,rem/0.45)*dt/1000));T.shown=T.full.slice(0,T.shown.length+add)}T.render();T.raf=T.full.length>T.shown.length?requestAnimationFrame(T.step):0};T.set=(f,i)=>{T.f=f||'';T.full=T.f+(i||'');const a=T.shown,b=T.full,n=Math.min(a.length,b.length);let k=0;while(k<n&&a[k]===b[k])k++;T.shown=a.slice(0,k);if(document.hidden){T.shown=b;T.render();return}if(!T.raf){T.last=performance.now();T.raf=requestAnimationFrame(T.step)}T.render()};T.hard=t=>{T.f=t||'';T.full=T.f;T.shown=T.f;if(T.raf){cancelAnimationFrame(T.raf);T.raf=0}T.render()};return T}

function onSx(s,e){let m;try{m=JSON.parse(e.data)}catch{return}if(m.error_code){console.warn('soniox',m.error_code,m.error_message);return}let oi='',ti='';const now=Date.now();

function recFor(s){if(s.rec&&s.rec.state!=='inactive'){try{s.rec.stop()}catch{}}s.q=[];const mt=mime();const r=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);s.rec=r;r.ondataavailable=e=>{if(!e.data.size||s.rec!==r)return;s.chain=s.chain.then(()=>e.data.arrayBuffer()).then(b=>{if(s.rec!==r)return;if(s.ws&&s.ws.readyState===1&&s.ready)s.ws.send(b);else if(running)s.q.push(b)}).catch(()=>{})};r.start(160)}
