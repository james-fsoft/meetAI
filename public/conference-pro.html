/* ── readability + built-in guidance ── */
.btn{font-size:11.5px}.seg button{font-size:10.5px;padding:7px 10px}.start{font-size:12px;padding:11px 16px}select{font-size:11.5px}.config label{font-size:10.5px;font-weight:600}.hint{font-size:10.5px}.status{font-size:11px}.badge,.idpill{font-size:11px}.footer{font-size:10.5px}.tabs button{font-size:10.5px}.speaker{font-size:11px}.lsub{font-size:9.5px}.plive{font-size:10px}.listen{font-size:10.5px}.head small{font-size:9.5px}.sharecard p{font-size:12px}.toast{font-size:12px}.segmeta{font-size:10px}
.uil,.gl{display:flex;align-items:center;gap:6px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 9px;color:var(--mut);cursor:pointer}
.uil svg,.gl svg{width:15px;height:15px;flex-shrink:0}
.uil select,.gl select{border:0;padding:0 2px;background:transparent;font-size:11.5px;font-weight:650;color:var(--ink);cursor:pointer;outline:none}
.helpBtn{width:38px;padding:0;font-size:14px;font-weight:800;color:var(--blue)}
.note{margin:10px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:760px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 11%,var(--card));border:1px solid color-mix(in srgb,#f59e0b 36%,var(--line));font-size:11.5px;line-height:1.5;color:var(--ink)}
.note[hidden]{display:none}
.noteBtn{flex-shrink:0;color:#fff;background:var(--blue);border-radius:8px;padding:6px 11px;font-weight:700;text-decoration:none}
.start.idle{animation:fmPulse 2.4s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){.start.idle{animation:none}}
.tip{position:fixed;left:0;top:0;z-index:200;max-width:270px;padding:7px 10px;border-radius:8px;background:#111827;color:#fff;font-size:11px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.tip.on{opacity:1;transform:none}

.guide[hidden]{display:none}

.current{font-size:calc(clamp(28px,2.45vw,46px)*var(--fs,1))}.current.empty{font-size:calc(clamp(20px,1.65vw,29px)*var(--fs,1))}

      if(p.scrollHeight<=H-2&&p.textContent===full)lo=mid;else hi=mid}
